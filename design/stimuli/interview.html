<!--
  0단계 인터뷰 페이지 골격. design-maker 가 <script id="harness-data"> 의 JSON 만 채워 design/stimuli/interview.html 로 낸다.
  메인이 artifact-capabilities 스킬을 로드한 뒤 capabilities: {db: {}} 로 발행하고, 끝나면 read_db(collection "answers") 로 회수한다.
  이 파일의 마크업·스크립트는 고치지 않는다(D-6 함정: db 읽기 실패와 연결 실패를 분리, 에러 코드 노출).
  db 가 없으면(미발행·오프라인) localStorage 에 저장하고 "답변 내보내기" 로 JSON 을 복사해 채팅에 붙이게 한다.
-->
<title>디자인 인터뷰</title>
<style>
  :root{--bg:#F6F8F5;--surface:#fff;--ink:#1C2228;--ink-2:#5A6470;--line:#D9DFD9;--accent:#0F6E63;--accent-soft:#DCEFEA;--human:#B7791F;--human-soft:#FBF0DA;--bad:#B4402E;--bad-soft:#F8E6E2;--good:#2C6E52}
  @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#151A1C;--surface:#1D2326;--ink:#E8ECE9;--ink-2:#A3ACB0;--line:#2E373B;--accent:#5FC4B4;--accent-soft:#1A3532;--human:#E2B25A;--human-soft:#3A2E15;--bad:#E07A66;--bad-soft:#3A1F1A;--good:#6CC39A}}
  :root[data-theme="dark"]{--bg:#151A1C;--surface:#1D2326;--ink:#E8ECE9;--ink-2:#A3ACB0;--line:#2E373B;--accent:#5FC4B4;--accent-soft:#1A3532;--human:#E2B25A;--human-soft:#3A2E15;--bad:#E07A66;--bad-soft:#3A1F1A;--good:#6CC39A}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;font-size:16px;line-height:1.6;word-break:keep-all;overflow-wrap:break-word}
  main{max-width:760px;margin:0 auto;padding:28px 18px 120px}
  h1{font-size:24px;margin:0 0 6px}
  .sub{color:var(--ink-2);margin:0 0 18px}
  .bar{position:sticky;top:0;background:var(--bg);padding:10px 0;z-index:5;border-bottom:1px solid var(--line);margin-bottom:18px}
  .steps{display:flex;gap:6px;font-size:13px}
  .steps span{flex:1;text-align:center;padding:6px 4px;border-radius:6px;background:var(--surface);border:1px solid var(--line);color:var(--ink-2)}
  .steps span.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .steps span.done{background:var(--accent-soft);color:var(--accent)}
  .prog{height:6px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
  .status{font-size:12.5px;color:var(--ink-2);margin-top:6px;display:flex;justify-content:space-between;gap:12px}
  .status .err{color:var(--bad)}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin:0 0 14px}
  .q{font-size:17px;font-weight:600;margin:0 0 10px}
  .hint{font-size:13.5px;color:var(--ink-2);margin:-4px 0 10px}
  .opts{display:grid;gap:8px;margin-bottom:10px}
  button.opt{text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer;min-height:44px}
  button.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
  button.opt.unk{color:var(--ink-2);border-style:dashed}
  button.opt.unk.sel{border-color:var(--human);background:var(--human-soft);color:var(--ink)}
  textarea{width:100%;min-height:64px;border:1px solid var(--line);border-radius:8px;padding:10px;font:inherit;background:var(--surface);color:var(--ink)}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
  .saved{font-size:12.5px;color:var(--good)}.saved.err{color:var(--bad)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
  .tile .id{font-weight:600;font-size:13px;margin-bottom:6px}
  .tile .stim{border:1px solid var(--line);border-radius:6px;overflow:hidden;min-height:120px;background:#fff;color:#111}
  .verd{display:flex;gap:6px;margin:8px 0 6px}
  .verd button{flex:1;min-height:40px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
  .verd button.sel{border-color:var(--accent);background:var(--accent-soft)}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:520px){.pair{grid-template-columns:1fr}}
  .pair .stim{border:1px solid var(--line);border-radius:6px;overflow:hidden;min-height:140px;background:#fff;color:#111;cursor:pointer}
  .pair .stim.sel{outline:3px solid var(--accent)}
  .banner{background:var(--human-soft);border-left:3px solid var(--human);padding:8px 12px;border-radius:0 6px 6px 0;margin:0 0 14px;font-size:14px}
  .nav{display:flex;justify-content:space-between;gap:10px;margin-top:18px}
  .btn{padding:12px 18px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:#fff;font:inherit;cursor:pointer;min-height:44px}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn[disabled]{opacity:.5;cursor:default}
  .fallback{display:none;margin-top:14px}.fallback.show{display:block}
  .done{text-align:center;padding:30px 0}
  [hidden]{display:none!important}
</style>

<script>
(function () {
  const DATA = JSON.parse(document.getElementById('harness-data').textContent);
  const $ = (id) => document.getElementById(id);
  const state = { answers: {}, step: 0, db: null, dbErr: null };
  const LS_KEY = 'harness-interview-answers';

  /* ---------- 저장: db 우선, 없으면 localStorage. 읽기 실패와 연결 실패를 구분한다 ---------- */
  async function initDb() {
    try {
      const db = window.claude && window.claude.use ? await window.claude.use('db') : null;
      if (!db) { state.db = null; $('conn').textContent = '저장소 없음 — 이 브라우저에만 저장'; $('fallback').classList.add('show'); loadLocal(); return; }
      state.db = db;
      try {
        const snap = await db.collection('answers').get();
        (snap.docs || []).forEach((d) => { const v = d.data(); if (v && v.id) state.answers[v.id] = v; });
        $('conn').textContent = '저장소 연결됨 · 답은 누르는 즉시 저장';
      } catch (e) {
        // 읽기 실패 ≠ 연결 실패. 저장은 될 수 있다. 코드를 화면에 보인다.
        state.dbErr = e && e.code ? e.code : String(e);
        $('conn').innerHTML = '연결됨 · 이전 답 읽기 실패 <span class="err">(' + state.dbErr + ')</span> — 새 답은 저장됩니다';
      }
    } catch (e) { state.db = null; $('conn').textContent = '저장소 없음 (' + (e && e.code ? e.code : e) + ') — 이 브라우저에만 저장'; $('fallback').classList.add('show'); loadLocal(); }
    render();
  }
  function loadLocal() { try { const raw = localStorage.getItem(LS_KEY); if (raw) state.answers = JSON.parse(raw); } catch (e) {} }
  function saveLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(state.answers)); } catch (e) {} $('export').value = JSON.stringify(state.answers, null, 1); }
  async function save(rec, el) {
    rec.ts = new Date().toISOString(); state.answers[rec.id] = rec; updateProgress();
    if (!state.db) { saveLocal(); mark(el, '이 브라우저에 저장됨'); return; }
    try { await state.db.doc('answers/' + rec.id).set(rec); mark(el, '저장됨'); }
    catch (e) { const code = e && e.code ? e.code : String(e); saveLocal(); mark(el, '저장 실패 (' + code + ') — 브라우저에 보관', true); $('fallback').classList.add('show'); }
  }
  function mark(el, text, bad) { if (!el) return; el.textContent = text; el.className = 'saved' + (bad ? ' err' : ''); }

  /* ---------- 진행률 ---------- */
  function items() { return DATA.questions.length + DATA.tiles.length + undecidedPairs().length; }
  function answeredCount() { return Object.keys(state.answers).filter((k) => !k.startsWith('meta')).length; }
  function updateProgress() { const n = items(), a = Math.min(answeredCount(), n); $('prog').style.width = (n ? Math.round(a / n * 100) : 0) + '%'; $('cnt').textContent = a + ' / ' + n; }

  /* ---------- 갤러리 반응으로 갈리지 않은 축만 월드컵에 노출 ---------- */
  function undecidedPairs() {
    const byAxis = {};
    DATA.tiles.forEach((t) => { const a = state.answers[t.id]; if (!a) return; (byAxis[t.axis] = byAxis[t.axis] || {})[t.variant] = (byAxis[t.axis][t.variant] || []).concat(a.verdict); });
    return DATA.pairs.filter((p) => {
      const v = byAxis[p.axis]; if (!v) return true;
      const liked = Object.keys(v).filter((k) => v[k].includes('좋다'));
      const disliked = Object.keys(v).filter((k) => v[k].includes('싫다'));
      // 한 변형만 좋다 이고 다른 변형에 좋다 가 없으면 결정됨. 좋다 가 둘 이상이거나 0 이면 미결.
      return !(liked.length === 1 && (disliked.length >= 1 || Object.keys(v).length === 1));
    });
  }

  /* ---------- 렌더 ---------- */
  function render() {
    $('title').textContent = DATA.title; $('intro').textContent = DATA.intro; $('banner').textContent = DATA.banner;
    renderQuestions(); renderTiles(); renderPairs(); showStep(state.step); updateProgress();
  }
  function renderQuestions() {
    const root = $('step0'); root.innerHTML = '';
    DATA.questions.forEach((q) => {
      const a = state.answers[q.id] || {};
      const card = document.createElement('div'); card.className = 'card';
      card.innerHTML = '<p class="q">' + esc(q.text) + '</p>' + (q.kind === 'pushback' ? '<p class="hint">PRD와 다르게 갈 수도 있는 지점입니다. 실제로 쓸 때를 떠올려 골라 주세요.</p>' : '');
      const opts = document.createElement('div'); opts.className = 'opts';
      q.options.forEach((o) => { const b = document.createElement('button'); b.className = 'opt' + (a.value === o.value ? ' sel' : ''); b.innerHTML = '<b>' + esc(o.value) + '</b><br><span style="color:var(--ink-2);font-size:14px">' + esc(o.scene) + '</span>'; b.onclick = () => { a.value = o.value; a.unknown = false; save(Object.assign({ id: q.id, kind: q.kind || 'question', question: q.text, free: a.free || '' }, a), card.querySelector('.saved')); renderQuestions(); }; opts.appendChild(b); });
      if (q.unknown) { const b = document.createElement('button'); b.className = 'opt unk' + (a.unknown ? ' sel' : ''); b.textContent = '모르겠음 — 기본값으로 진행해도 돼요'; b.onclick = () => { a.unknown = true; a.value = ''; save(Object.assign({ id: q.id, kind: q.kind || 'question', question: q.text, free: a.free || '' }, a), card.querySelector('.saved')); renderQuestions(); }; opts.appendChild(b); }
      card.appendChild(opts);
      if (q.free) { const ta = document.createElement('textarea'); ta.placeholder = q.options.length ? '덧붙일 말이 있으면 자유롭게 (선택)' : '떠오르는 대로 한두 줄'; ta.value = a.free || ''; ta.onchange = () => { a.free = ta.value; save(Object.assign({ id: q.id, kind: q.kind || 'question', question: q.text }, a), card.querySelector('.saved')); }; card.appendChild(ta); }
      const row = document.createElement('div'); row.className = 'row'; row.innerHTML = '<span class="saved">' + (a.ts ? '저장됨' : '') + '</span>'; card.appendChild(row);
      root.appendChild(card);
    });
  }
  function renderTiles() {
    const root = $('tiles'); root.innerHTML = '';
    DATA.tiles.forEach((t) => {
      const a = state.answers[t.id] || {};
      const el = document.createElement('div'); el.className = 'tile';
      el.innerHTML = '<div class="id">' + esc(t.id) + '</div><div class="stim">' + t.html + '</div>';
      const v = document.createElement('div'); v.className = 'verd';
      ['좋다', '싫다', '애매'].forEach((k) => { const b = document.createElement('button'); b.textContent = k; if (a.verdict === k) b.className = 'sel'; b.onclick = () => { a.verdict = k; save(Object.assign({ id: t.id, kind: 'tile', axis_hidden: true }, a), el.querySelector('.saved')); renderTiles(); renderPairs(); updateProgress(); }; v.appendChild(b); });
      el.appendChild(v);
      const ta = document.createElement('textarea'); ta.style.minHeight = '40px'; ta.placeholder = '왜요? (한 줄, 선택)'; ta.value = a.reason || ''; ta.onchange = () => { a.reason = ta.value; save(Object.assign({ id: t.id, kind: 'tile' }, a), el.querySelector('.saved')); }; el.appendChild(ta);
      const row = document.createElement('div'); row.className = 'row'; row.innerHTML = '<span class="saved">' + (a.ts ? '저장됨' : '') + '</span>'; el.appendChild(row);
      root.appendChild(el);
    });
  }
  function renderPairs() {
    const root = $('pairs'); root.innerHTML = '';
    const list = undecidedPairs();
    if (!list.length) { root.innerHTML = '<p class="hint">앞 단계 답으로 전부 갈렸습니다. 다음으로 넘어가세요.</p>'; return; }
    list.forEach((p, i) => {
      const id = 'W-' + (i + 1); const a = state.answers[id] || {};
      const card = document.createElement('div'); card.className = 'card';
      card.innerHTML = '<p class="q">어느 쪽이 더 편한가요?</p>';
      const pair = document.createElement('div'); pair.className = 'pair';
      [['left', p.left], ['right', p.right]].forEach(([side, s]) => { const d = document.createElement('div'); d.className = 'stim' + (a.choice === side ? ' sel' : ''); d.innerHTML = s.html; d.onclick = () => { a.choice = side; a.chosen_id = s.id; save(Object.assign({ id, kind: 'pair', axis_hidden: true, left_id: p.left.id, right_id: p.right.id }, a), card.querySelector('.saved')); renderPairs(); }; pair.appendChild(d); });
      card.appendChild(pair);
      const none = document.createElement('button'); none.className = 'opt unk' + (a.choice === 'none' ? ' sel' : ''); none.textContent = '둘 다 아님'; none.style.marginTop = '8px'; none.onclick = () => { a.choice = 'none'; a.chosen_id = ''; save(Object.assign({ id, kind: 'pair', axis_hidden: true, left_id: p.left.id, right_id: p.right.id }, a), card.querySelector('.saved')); renderPairs(); }; card.appendChild(none);
      const ta = document.createElement('textarea'); ta.style.minHeight = '40px'; ta.placeholder = '왜요? (한 줄, 선택)'; ta.value = a.reason || ''; ta.onchange = () => { a.reason = ta.value; save(Object.assign({ id, kind: 'pair', axis_hidden: true, left_id: p.left.id, right_id: p.right.id }, a), card.querySelector('.saved')); }; card.appendChild(ta);
      const row = document.createElement('div'); row.className = 'row'; row.innerHTML = '<span class="saved">' + (a.ts ? '저장됨' : '') + '</span>'; card.appendChild(row);
      root.appendChild(card);
    });
  }
  function showStep(n) {
    state.step = n; [0, 1, 2, 3].forEach((i) => { $('step' + i).hidden = i !== n; const s = $('s' + i); s.className = i === n ? 'on' : (i < n ? 'done' : ''); });
    $('prev').disabled = n === 0; $('next').textContent = n === 2 ? '완료' : '다음'; $('next').hidden = n === 3;
    if (n === 2) renderPairs();
    if (n === 3) { const rec = { id: 'meta-status', kind: 'meta', done: true, answered: answeredCount(), total: items() }; save(rec, null); $('doneinfo').textContent = '답한 항목 ' + rec.answered + ' / ' + rec.total; }
    window.scrollTo(0, 0);
  }
  $('prev').onclick = () => showStep(Math.max(0, state.step - 1));
  $('next').onclick = () => showStep(Math.min(3, state.step + 1));
  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
  render(); initDb();
})();
</script>
