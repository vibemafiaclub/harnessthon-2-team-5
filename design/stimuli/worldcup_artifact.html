<title>대비쌍 고르기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  :root{
    --ground:#F5F4F0;
    --surface:#FFFFFF;
    --surface-sunk:#EDEBE4;
    --ink:#23211C;
    --ink-soft:#6B675E;
    --ink-faint:#9C978C;
    --line:#DEDBD2;
    --accent:#414A85;
    --accent-soft:#E5E7F2;
    --good:#2E6A4E;
    --mid:#7A6420;
    --mid-soft:#F0E9D3;
    --shadow:0 1px 2px rgba(35,33,28,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#1A1917;
      --surface:#242320;
      --surface-sunk:#131211;
      --ink:#EDEAE2;
      --ink-soft:#A9A399;
      --ink-faint:#77726A;
      --line:#38352F;
      --accent:#9AA3DC;
      --accent-soft:#2B2E45;
      --good:#7BC49B;
      --mid:#D8BE72;
      --mid-soft:#3A3220;
      --shadow:0 1px 2px rgba(0,0,0,.4);
    }
  }
  :root[data-theme="dark"]{
    --ground:#1A1917;
    --surface:#242320;
    --surface-sunk:#131211;
    --ink:#EDEAE2;
    --ink-soft:#A9A399;
    --ink-faint:#77726A;
    --line:#38352F;
    --accent:#9AA3DC;
    --accent-soft:#2B2E45;
    --good:#7BC49B;
    --mid:#D8BE72;
    --mid-soft:#3A3220;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--ground);color:var(--ink);
    font-family:"IBM Plex Sans KR",system-ui,-apple-system,sans-serif;
    font-size:14px;line-height:1.6;
  }
  .wrap{max-width:900px;margin:0 auto;padding:0 20px 96px;}

  header.top{padding:36px 0 20px;border-bottom:1px solid var(--line);margin-bottom:28px;}
  .eyebrow{
    font-family:"IBM Plex Mono",ui-monospace,monospace;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);margin-bottom:10px;
  }
  h1{
    font-family:"Gowun Batang",Georgia,serif;
    font-size:32px;font-weight:700;line-height:1.25;margin:0 0 10px;text-wrap:balance;
  }
  .lede{margin:0;max-width:62ch;color:var(--ink-soft);}
  .lede strong{color:var(--ink);font-weight:600;}
  .savestate{
    display:inline-block;margin-top:14px;font-size:12px;color:var(--ink-faint);
    font-family:"IBM Plex Mono",monospace;
  }
  .savestate[data-state="saved"]{color:var(--good);}
  .savestate[data-state="local"]{color:var(--mid);}

  .round{
    margin-bottom:32px;padding:20px;
    background:var(--surface);border:1px solid var(--line);border-radius:12px;
  }
  .round[data-answered="1"]{border-color:var(--accent);}
  .roundhead{display:flex;align-items:baseline;gap:10px;margin-bottom:4px;}
  .rno{
    font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--accent);
  }
  .rq{font-size:15px;font-weight:600;margin:0 0 16px;}

  .pair{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px;}
  .side{display:flex;flex-direction:column;gap:8px;}
  .sidelabel{
    font-family:"IBM Plex Mono",monospace;font-size:12px;letter-spacing:.06em;
    color:var(--ink-soft);text-align:center;
  }
  @media (max-width:560px){
    .pair{grid-template-columns:1fr;}
  }

  .picks{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
  .pbtn{
    flex:1;min-width:110px;padding:10px 8px;
    border:1px solid var(--line);border-radius:8px;
    background:var(--surface);color:var(--ink-soft);
    font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;
    transition:background .12s,border-color .12s,color .12s;
  }
  .pbtn:hover{border-color:var(--ink-faint);}
  .pbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .pbtn[aria-pressed="true"]{
    background:var(--accent-soft);border-color:var(--accent);
    color:var(--accent);font-weight:600;
  }
  .pbtn[aria-pressed="true"][data-p="neither"]{
    background:var(--mid-soft);border-color:var(--mid);color:var(--mid);
  }

  .reason{
    width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
    background:var(--surface-sunk);color:var(--ink);
    font-family:inherit;font-size:14px;
  }
  .reason::placeholder{color:var(--ink-faint);}
  .reason:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}

  .neither-note{
    margin:10px 0 0;padding:9px 11px;border-radius:7px;
    background:var(--mid-soft);color:var(--mid);font-size:12.5px;
  }
  .neither-note[hidden]{display:none !important;}

  .offline{
    margin-top:18px;padding:10px 12px;border-radius:7px;
    background:var(--mid-soft);color:var(--mid);font-size:12.5px;
  }
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;} }

  /* ============================================================
     자극 타일 — 보드 UI 의 폰트·색이 스며들면 비교가 오염된다.
     system-ui 로 못박고 위 토큰을 일절 쓰지 않는다.
     ============================================================ */
  .tile{
    width:100%;aspect-ratio:3/4;padding:16px;
    display:flex;flex-direction:column;overflow:hidden;
    font-family:system-ui,-apple-system,sans-serif;
    font-size:14px;line-height:1.6;
    background:#F7F7F5;color:#2A2A28;
    border-radius:10px;border:1px solid #E4E4E1;
  }
  .tile .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .tile .list{flex:1;display:flex;flex-direction:column;}
  .tile .row{display:flex;flex-direction:column;padding:10px 0;border-bottom:1px solid #E4E4E1;font-size:13px;line-height:1.5;}
  .tile .row:last-child{border-bottom:none;}
  .tile .title{font-size:16px;font-weight:700;}
  .tile .chip{font-size:11px;padding:4px 9px;border-radius:999px;font-weight:600;background:#E7EFEC;color:#1F4B3B;}
  .tile .btn{align-self:flex-start;border:none;cursor:default;margin-top:10px;padding:9px 14px;border-radius:8px;font-size:13px;font-weight:600;background:#2A2A28;color:#FFFFFF;}

  /* 이상형 월드컵 4장 — 형태(둥근카드)·밀도(여유간격)는 두 라운드 모두 고정, 라운드1=채도만/라운드2=타이포만 변경 */
  #w1a,#w1b,#w2a,#w2b{border-radius:20px;}
  #w1a .row,#w1b .row,#w2a .row,#w2b .row{border-bottom:none;background:#FFFFFF;border-radius:14px;padding:14px 12px;margin-bottom:10px;line-height:1.6;box-shadow:0 1px 2px rgba(0,0,0,.05);}
  #w1a .row:last-child,#w1b .row:last-child,#w2a .row:last-child,#w2b .row:last-child{margin-bottom:0;}
  #w1a .btn,#w1b .btn,#w2a .btn,#w2b .btn{border-radius:999px;}

  #w1a{background:#EEF0F2;}
  #w1a .title{color:#383D42;}
  #w1a .chip{background:#D7DBDE;color:#3F444A;}
  #w1a .btn{background:#4B5563;color:#FFFFFF;}

  #w1b{background:#E7F0FF;}
  #w1b .title{color:#0B3D91;}
  #w1b .chip{background:#BFD9FF;color:#0A3D8F;}
  #w1b .btn{background:#1657CC;color:#FFFFFF;}

  #w2a,#w2b{background:#F7F7F5;}
  #w2a .chip,#w2b .chip{background:#E4E7EA;color:#33424F;}
  #w2a .btn,#w2b .btn{background:#2A2A28;color:#FFFFFF;}

  #w2a .title{font-size:22px;font-weight:800;letter-spacing:-.01em;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
  #w2a .row{font-size:13px;font-weight:400;letter-spacing:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
  #w2a .btn{font-weight:700;font-size:13px;}

  #w2b .title{font-size:15px;font-weight:500;letter-spacing:.01em;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
  #w2b .row{font-size:14px;font-weight:400;letter-spacing:.01em;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;}
  #w2b .btn{font-weight:500;font-size:13px;}
</style>

<div class="wrap">
  <header class="top">
    <div class="eyebrow">청첩장모임 스케줄러 · 0단계 인터뷰</div>
    <h1>둘 중 어느 쪽이 편한가요</h1>
    <p class="lede">앞에서 <strong>한 장씩 보고는 갈리지 않은 것 두 가지</strong>가 남았습니다. 하나만 보면 진한지 옅은지 알기 어렵지만, 둘을 나란히 놓으면 알 수 있습니다. 두 장은 <strong>딱 한 가지만</strong> 다르고 나머지는 똑같습니다.</p>
    <span class="savestate" id="saveState" data-state="idle">불러오는 중…</span>
  </header>

  <div id="rounds"></div>

  <div class="offline" id="offlineNote" hidden>저장 기능에 연결하지 못했습니다. 입력한 내용은 이 브라우저에만 남습니다 — 창을 닫기 전에 알려 주세요.</div>
</div>

<script>
(function(){
  "use strict";

  var TILE_MARKUP =
    '<div class="top"><span class="title">이번 주말</span><span class="chip">조율 중</span></div>' +
    '<div class="list">' +
      '<div class="row">대학 동기 모임 · 토 저녁 · 회신 4/6</div>' +
      '<div class="row">회사 선배 모임 · 토 낮 · 회신 2/5</div>' +
      '<div class="row">동네 친구 모임 · 일 점심 · 확정</div>' +
    '</div>' +
    '<button class="btn" tabindex="-1">모임 만들기</button>';

  var ROUNDS = [
    {
      id: "round1",
      question: "두 화면 중 어느 쪽 색이 더 편한가요?",
      left:  {id:"w1a", label:"왼쪽"},
      right: {id:"w1b", label:"오른쪽"}
    },
    {
      id: "round2",
      question: "두 화면 중 어느 쪽 글자가 더 편한가요?",
      left:  {id:"w2a", label:"왼쪽"},
      right: {id:"w2b", label:"오른쪽"}
    }
  ];

  var PICKS = [
    {p:"left",    label:"왼쪽"},
    {p:"right",   label:"오른쪽"},
    {p:"neither", label:"둘 다 아님"}
  ];

  var state = {};
  var db = null;
  var saveEl = document.getElementById("saveState");

  function rec(id){
    if(!state[id]) state[id] = {pick:"", reason:""};
    return state[id];
  }
  function setSave(s, t){ saveEl.dataset.state = s; saveEl.textContent = t; }

  function buildRound(r){
    var box = document.createElement("section");
    box.className = "round";
    box.dataset.id = r.id;

    var head = document.createElement("div");
    head.className = "roundhead";
    head.innerHTML = '<span class="rno">' + r.id.replace("round", "라운드 ") + '</span>';
    box.appendChild(head);

    var q = document.createElement("p");
    q.className = "rq";
    q.textContent = r.question;
    box.appendChild(q);

    var pair = document.createElement("div");
    pair.className = "pair";
    [r.left, r.right].forEach(function(side){
      var col = document.createElement("div");
      col.className = "side";
      var tile = document.createElement("div");
      tile.className = "tile";
      tile.id = side.id;
      tile.setAttribute("aria-hidden", "true");
      tile.innerHTML = TILE_MARKUP;
      col.appendChild(tile);
      var lab = document.createElement("div");
      lab.className = "sidelabel";
      lab.textContent = side.label;
      col.appendChild(lab);
      pair.appendChild(col);
    });
    box.appendChild(pair);

    var picks = document.createElement("div");
    picks.className = "picks";
    picks.setAttribute("role", "group");
    picks.setAttribute("aria-label", r.question);
    PICKS.forEach(function(o){
      var b = document.createElement("button");
      b.className = "pbtn";
      b.type = "button";
      b.dataset.p = o.p;
      b.textContent = o.label;
      b.setAttribute("aria-pressed", "false");
      b.addEventListener("click", function(){
        var s = rec(r.id);
        s.pick = (s.pick === o.p) ? "" : o.p;
        paint(r.id);
        save(r.id);
      });
      picks.appendChild(b);
    });
    box.appendChild(picks);

    var reason = document.createElement("input");
    reason.className = "reason";
    reason.type = "text";
    reason.placeholder = "왜 그런지 한 줄 (선택)";
    reason.setAttribute("aria-label", r.question + " 이유");
    reason.addEventListener("input", function(){ rec(r.id).reason = reason.value; });
    reason.addEventListener("change", function(){ save(r.id); });
    reason.addEventListener("blur", function(){ save(r.id); });
    box.appendChild(reason);

    var nn = document.createElement("p");
    nn.className = "neither-note";
    nn.hidden = true;
    nn.textContent = "둘 다 아니라고 하신 것도 정식 답입니다. 이 부분은 제가 정하고, 무엇을 어떻게 정했는지 남겨 두겠습니다.";
    box.appendChild(nn);

    return box;
  }

  function paint(id){
    var box = document.querySelector('.round[data-id="' + id + '"]');
    if(!box) return;
    var s = rec(id);
    box.querySelectorAll(".pbtn").forEach(function(b){
      b.setAttribute("aria-pressed", String(b.dataset.p === s.pick));
    });
    var input = box.querySelector(".reason");
    if(input && input.value !== s.reason) input.value = s.reason || "";
    box.querySelector(".neither-note").hidden = (s.pick !== "neither");
    box.dataset.answered = s.pick ? "1" : "0";
  }

  var pending = {}, timer = null;
  function save(id){
    pending[id] = true;
    if(timer) clearTimeout(timer);
    timer = setTimeout(flush, 400);
  }
  function flush(){
    var ids = Object.keys(pending);
    pending = {};
    if(!ids.length) return;
    try{ localStorage.setItem("worldcup-picks", JSON.stringify(state)); }catch(e){}
    if(!db){ setSave("local", "이 브라우저에만 저장됨"); return; }
    setSave("idle", "저장 중…");
    Promise.all(ids.map(function(id){
      var s = rec(id);
      return db.doc("worldcup/" + id).set({
        round: id,
        pick: s.pick || "",
        reason: s.reason || "",
        updatedAt: new Date().toISOString()
      });
    })).then(function(){
      setSave("saved", "저장됨");
    }).catch(function(e){
      setSave("local", "저장 실패 (" + ((e && e.code) || "unknown") + ") — 이 브라우저에만 남음");
    });
  }

  var host = document.getElementById("rounds");
  ROUNDS.forEach(function(r){ host.appendChild(buildRound(r)); });

  try{
    var cached = JSON.parse(localStorage.getItem("worldcup-picks") || "{}");
    Object.keys(cached).forEach(function(k){ state[k] = cached[k]; });
  }catch(e){}
  ROUNDS.forEach(function(r){ paint(r.id); });

  function goOffline(why){
    db = null;
    setSave("local", "이 브라우저에만 저장됨");
    var note = document.getElementById("offlineNote");
    note.hidden = false;
    if(why) note.textContent += " (" + why + ")";
  }

  claude.use("db").then(function(ns){
    if(!ns){ goOffline("not_granted"); return; }
    db = ns;
    setSave("saved", "저장 준비됨");
    return db.collection("worldcup").get().then(function(snap){
      var docs = (snap && snap.docs) || [];
      docs.forEach(function(d){
        if(!d || !d.exists) return;
        var data = d.data() || {};
        var id = data.round || d.id;
        if(!id) return;
        state[id] = {pick: data.pick || "", reason: data.reason || ""};
      });
      ROUNDS.forEach(function(r){ paint(r.id); });
    }).catch(function(){
      setSave("saved", "저장 준비됨 (이전 기록은 못 불러옴)");
    });
  }).catch(function(e){
    goOffline(e && e.code ? e.code : "load_failed");
  });
})();
</script>
