&lt;style&gt;
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--color-semantic-bg-surface);
    font-family: var(--typography-family-fallback);
    color: var(--color-semantic-text-primary);
    display: flex;
    flex-wrap: wrap;
    gap: var(--spacing-scale-8);
    padding: var(--spacing-scale-8);
  }
  .screen {
    width: 390px;
    height: 844px;
    background: var(--color-semantic-bg-page);
    border-radius: var(--radius-scale-lg);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    box-shadow: var(--elevation-scale-md-offset) var(--elevation-scale-md-blur) var(--elevation-scale-md-spread) rgba(23,27,24,var(--elevation-scale-md-opacity));
  }
  .statusbar {
    height: 44px;
    flex: 0 0 44px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 var(--spacing-scale-4);
    font-size: var(--typography-scale-caption-size);
    font-weight: 600;
    color: var(--color-semantic-text-primary);
  }
  .content { flex: 1 1 auto; overflow: hidden; padding: 0 var(--spacing-scale-4); }
  .tabbar {
    height: 64px;
    flex: 0 0 64px;
    display: flex;
    border-top: 1px solid var(--color-semantic-border-default);
    background: var(--color-semantic-bg-elevated);
  }
  .tab {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--spacing-scale-0-5);
    font-size: var(--typography-scale-caption-size);
    color: var(--color-semantic-text-secondary);
  }
  .tab.active { color: var(--color-semantic-brand-default); font-weight: 600; }
  .dot { width: var(--spacing-scale-2); height: var(--spacing-scale-2); border-radius: var(--radius-scale-full); background: currentColor; }

  .state-label {
    font-size: var(--typography-scale-overline-size);
    letter-spacing: var(--typography-scale-overline-letterspacing);
    color: var(--color-semantic-text-secondary);
    text-transform: uppercase;
    text-align: center;
    margin-bottom: var(--spacing-scale-2);
  }

  header.app { display: flex; align-items: center; justify-content: space-between; padding: var(--spacing-scale-2) 0 var(--spacing-scale-3); }
  h1.section-title { font-size: var(--typography-scale-heading-1-size); font-weight: var(--typography-scale-heading-1-weight); margin: 0; }
  .add-btn {
    width: 36px; height: 36px;
    border-radius: var(--radius-scale-full);
    background: var(--color-semantic-brand-default);
    color: var(--color-semantic-text-on-primary);
    display: flex; align-items: center; justify-content: center;
    font-size: var(--typography-scale-heading-3-size);
    font-weight: 700;
  }
  .summary-line { font-size: var(--typography-scale-body-size); color: var(--color-semantic-text-secondary); margin-bottom: var(--spacing-scale-3); }
  .summary-line b { color: var(--color-semantic-brand-default); }

  .search-input {
    width: 100%;
    background: var(--color-semantic-bg-surface);
    border: 1px solid var(--color-semantic-border-default);
    border-radius: var(--radius-scale-lg);
    padding: var(--spacing-scale-2) var(--spacing-component-padding-input-x);
    font-size: var(--typography-scale-body-size);
    color: var(--color-semantic-text-secondary);
    margin-bottom: var(--spacing-scale-3);
  }

  .chip-row { display: flex; gap: var(--spacing-scale-2); overflow-x: auto; padding-bottom: var(--spacing-scale-3); }
  .chip {
    flex: 0 0 auto;
    padding: var(--spacing-scale-1) var(--spacing-scale-4);
    border-radius: var(--radius-scale-full);
    border: 1px solid var(--color-semantic-border-default);
    font-size: var(--typography-scale-body-small-size);
    color: var(--color-semantic-text-secondary);
    white-space: nowrap;
  }
  .chip.active { background: var(--color-semantic-brand-default); border-color: var(--color-semantic-brand-default); color: var(--color-semantic-text-on-primary); font-weight: 600; }

  .idx-label {
    font-size: var(--typography-scale-caption-size);
    font-weight: 700;
    color: var(--color-semantic-text-secondary);
    padding: var(--spacing-scale-2) 0 var(--spacing-scale-1);
  }
  .contact-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: var(--spacing-scale-2) 0;
    border-bottom: 1px solid var(--color-semantic-border-default);
  }
  .contact-main { display: flex; align-items: center; gap: var(--spacing-scale-2); }
  .avatar {
    width: 32px; height: 32px; border-radius: var(--radius-scale-full);
    background: var(--color-semantic-brand-subtle);
    color: var(--color-semantic-brand-default);
    display: flex; align-items: center; justify-content: center;
    font-size: var(--typography-scale-body-small-size); font-weight: 700;
  }
  .contact-name { font-size: var(--typography-scale-body-size); font-weight: 600; }
  .contact-tags { display: flex; gap: var(--spacing-scale-1); margin-top: var(--spacing-scale-0-5); }
  .rel-tag { font-size: var(--typography-scale-caption-size); color: var(--color-semantic-text-secondary); }
  .dup-tag {
    font-size: var(--typography-scale-caption-size);
    font-weight: 600;
    color: var(--color-semantic-alert-overlap-text);
    background: var(--color-semantic-alert-overlap-bg);
    padding: 0 var(--spacing-scale-1);
    border-radius: var(--radius-scale-sm);
  }
  .contact-status { font-size: var(--typography-scale-caption-size); color: var(--color-semantic-text-secondary); text-align: right; }
  .contact-status.unassigned { color: var(--color-semantic-accent-default); font-weight: 600; }
  .contact-status.pending { color: var(--color-semantic-status-closing-text); font-weight: 600; }

  .empty-box {
    background: var(--color-semantic-bg-surface);
    border: 1px dashed var(--color-semantic-border-default);
    border-radius: var(--radius-scale-xl);
    padding: var(--spacing-scale-8) var(--spacing-scale-4);
    text-align: center;
    color: var(--color-semantic-text-secondary);
    margin-top: var(--spacing-scale-6);
  }
  .empty-title { font-size: var(--typography-scale-heading-3-size); color: var(--color-semantic-text-primary); margin-bottom: var(--spacing-scale-2); }
  .empty-actions { display: flex; flex-direction: column; gap: var(--spacing-scale-2); margin-top: var(--spacing-scale-4); }
  .empty-btn {
    display: block;
    padding: var(--spacing-scale-2) var(--spacing-scale-4);
    border-radius: var(--radius-scale-lg);
    font-size: var(--typography-scale-body-size);
    font-weight: 600;
  }
  .empty-btn.primary { background: var(--color-semantic-brand-default); color: var(--color-semantic-text-on-primary); }
  .empty-btn.secondary { background: var(--color-semantic-bg-elevated); color: var(--color-semantic-text-primary); border: 1px solid var(--color-semantic-border-default); }

  .skeleton { background: var(--color-semantic-bg-surface); border-radius: var(--radius-scale-sm); }
  .sk-line { height: var(--spacing-scale-4); margin-bottom: var(--spacing-scale-3); border-radius: var(--radius-scale-sm); }
  .sk-chip { width: 60px; height: var(--spacing-scale-6); border-radius: var(--radius-scale-full); display: inline-block; margin-right: var(--spacing-scale-2); }
  .sk-row { display: flex; align-items: center; gap: var(--spacing-scale-2); padding: var(--spacing-scale-2) 0; border-bottom: 1px solid var(--color-semantic-border-default); }
  .sk-avatar { width: 32px; height: 32px; border-radius: var(--radius-scale-full); flex: 0 0 auto; }
  .sk-text { flex: 1; height: var(--spacing-scale-3); border-radius: var(--radius-scale-sm); }
&lt;/style&gt;

&lt;style&gt;
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--color-semantic-bg-surface);
    font-family: var(--typography-family-body), var(--typography-family-fallback);
    color: var(--color-semantic-text-primary);
    max-width: var(--layout-content-max-width);
  }
  .screen { padding: var(--spacing-scale-5); display: flex; flex-direction: column; gap: var(--spacing-scale-8); }
  .state-block { display: flex; flex-direction: column; gap: var(--spacing-scale-4); }
  .state-label {
    font-size: var(--typography-scale-overline-size);
    letter-spacing: var(--typography-scale-overline-letterspacing);
    font-weight: var(--typography-scale-overline-weight);
    color: var(--color-semantic-text-secondary);
  }
  .card {
    background: var(--color-semantic-bg-elevated);
    border-radius: var(--radius-scale-xl);
    padding: var(--spacing-component-padding-card-y) var(--spacing-component-padding-card-x);
    box-shadow: var(--elevation-scale-sm-offset) var(--elevation-scale-sm-blur)px var(--elevation-scale-sm-spread)px rgba(23,27,24,0.07);
    display: flex; flex-direction: column; gap: var(--spacing-scale-4);
  }
  .meeting-title { font-size: var(--typography-scale-heading-1-size); font-weight: var(--typography-scale-heading-1-weight); line-height: var(--typography-scale-heading-1-lineheight); margin: 0; }
  .meeting-sub { font-size: var(--typography-scale-body-small-size); color: var(--color-semantic-text-secondary); margin: 0; }
  .badge {
    display: inline-flex; align-items: center; gap: var(--spacing-scale-1);
    padding: var(--spacing-scale-1) var(--spacing-scale-2);
    border-radius: var(--radius-scale-full);
    font-size: var(--typography-scale-caption-size); font-weight: var(--typography-scale-heading-3-weight);
    width: fit-content;
  }
  .badge--waiting { background: var(--color-semantic-status-waiting-bg); color: var(--color-semantic-status-waiting-text); }
  .badge--closing { background: var(--color-semantic-status-closing-bg); color: var(--color-semantic-status-closing-text); }
  .badge--confirmed { background: var(--color-semantic-status-confirmed-bg); color: var(--color-semantic-status-confirmed-text); }
  .response-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding-top: var(--spacing-scale-2); border-top: 1px solid var(--color-semantic-border-default);
  }
  .response-count { font-size: var(--typography-scale-display-size); font-weight: var(--typography-scale-display-weight); color: var(--color-semantic-brand-default); }
  .response-count small { font-size: var(--typography-scale-heading-3-size); color: var(--color-semantic-text-secondary); font-weight: var(--typography-scale-body-weight); }
  .deadline { text-align: right; }
  .deadline .num { font-size: var(--typography-scale-heading-2-size); font-weight: var(--typography-scale-heading-2-weight); }
  .deadline .num.urgent { color: var(--color-semantic-alert-deadline-text); }
  .deadline .lbl { font-size: var(--typography-scale-caption-size); color: var(--color-semantic-text-secondary); }
  .candidates { display: flex; flex-direction: column; gap: var(--spacing-scale-2); }
  .cand-row { display: flex; align-items: center; gap: var(--spacing-scale-3); }
  .cand-date { flex: 0 0 auto; font-size: var(--typography-scale-body-size); width: 84px; }
  .cand-bar-track { flex: 1; height: var(--spacing-scale-3); background: var(--color-semantic-bg-surface); border-radius: var(--radius-scale-full); overflow: hidden; }
  .cand-bar { height: 100%; background: var(--color-semantic-brand-default); border-radius: var(--radius-scale-full); }
  .cand-bar.best { background: var(--color-semantic-accent-default); }
  .cand-n { flex: 0 0 auto; font-size: var(--typography-scale-body-small-size); color: var(--color-semantic-text-secondary); width: 34px; text-align: right; }
  .chip {
    display: inline-flex; align-items: center; gap: var(--spacing-scale-1);
    padding: var(--spacing-scale-0-5) var(--spacing-scale-2);
    border-radius: var(--radius-scale-full);
    font-size: var(--typography-scale-caption-size);
  }
  .chip.ok { background: var(--color-semantic-response-yes-bg); color: var(--color-semantic-response-yes-text); }
  .chip.pending { border: 1px solid var(--color-semantic-border-default); color: var(--color-semantic-text-secondary); }
  .pending-list { display: flex; flex-direction: column; gap: var(--spacing-scale-2); }
  .pending-head { font-size: var(--typography-scale-body-small-size); color: var(--color-semantic-text-secondary); margin: 0; }
  .pending-names { display: flex; flex-wrap: wrap; gap: var(--spacing-scale-2); }
  .alert-box {
    background: var(--color-semantic-alert-deadline-bg); color: var(--color-semantic-alert-deadline-text);
    border-radius: var(--radius-scale-lg); padding: var(--spacing-scale-4);
    display: flex; flex-direction: column; gap: var(--spacing-scale-2);
    font-size: var(--typography-scale-body-small-size);
  }
  .alert-box strong { font-size: var(--typography-scale-body-size); }
  .btn {
    border: none; border-radius: var(--radius-scale-lg);
    padding: var(--spacing-component-padding-button-y) var(--spacing-component-padding-button-x);
    font-size: var(--typography-scale-body-size); font-weight: var(--typography-scale-heading-3-weight);
    cursor: pointer; width: 100%;
  }
  .btn-primary { background: var(--color-semantic-brand-default); color: var(--color-semantic-text-on-primary); }
  .btn-secondary { background: var(--color-semantic-bg-surface); color: var(--color-semantic-text-primary); border: 1px solid var(--color-semantic-border-default); }
  .btn-accent { background: var(--color-semantic-accent-default); color: var(--color-semantic-text-on-primary); }
  .btn-row { display: flex; gap: var(--spacing-scale-3); }
  .confirmed-date { font-size: var(--typography-scale-heading-2-size); font-weight: var(--typography-scale-heading-2-weight); color: var(--color-semantic-brand-hover); margin: 0; }
  hr.sep { border: none; border-top: 1px solid var(--color-semantic-border-default); margin: 0; }
&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div class=&quot;screen&quot;&gt;

  &lt;!-- 상태 1: 조율 중 --&gt;
  &lt;div class=&quot;state-block&quot;&gt;
    &lt;p class=&quot;state-label&quot;&gt;상태 1 · 조율 중&lt;/p&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;span class=&quot;badge badge--waiting&quot;&gt;조율 중&lt;/span&gt;
      &lt;h1 class=&quot;meeting-title&quot;&gt;대학 동기&lt;/h1&gt;
      &lt;p class=&quot;meeting-sub&quot;&gt;참석 예정 6명&lt;/p&gt;
      &lt;div class=&quot;response-row&quot;&gt;
        &lt;div class=&quot;response-count&quot;&gt;4&lt;small&gt;/6명 회신&lt;/small&gt;&lt;/div&gt;
        &lt;div class=&quot;deadline&quot;&gt;&lt;div class=&quot;num&quot;&gt;D-2&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;마감까지&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;hr class=&quot;sep&quot;&gt;
      &lt;div class=&quot;candidates&quot;&gt;
        &lt;div class=&quot;cand-row&quot;&gt;&lt;span class=&quot;cand-date&quot;&gt;10/17(토)&lt;/span&gt;&lt;div class=&quot;cand-bar-track&quot;&gt;&lt;div class=&quot;cand-bar best&quot; style=&quot;width:83%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;cand-n&quot;&gt;5/6&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;cand-row&quot;&gt;&lt;span class=&quot;cand-date&quot;&gt;10/18(일)&lt;/span&gt;&lt;div class=&quot;cand-bar-track&quot;&gt;&lt;div class=&quot;cand-bar&quot; style=&quot;width:50%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;cand-n&quot;&gt;3/6&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;cand-row&quot;&gt;&lt;span class=&quot;cand-date&quot;&gt;10/24(토)&lt;/span&gt;&lt;div class=&quot;cand-bar-track&quot;&gt;&lt;div class=&quot;cand-bar&quot; style=&quot;width:33%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;cand-n&quot;&gt;2/6&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;hr class=&quot;sep&quot;&gt;
      &lt;div class=&quot;pending-list&quot;&gt;
        &lt;p class=&quot;pending-head&quot;&gt;아직 답이 없어요&lt;/p&gt;
        &lt;div class=&quot;pending-names&quot;&gt;
          &lt;span class=&quot;chip pending&quot;&gt;박서연&lt;/span&gt;
          &lt;span class=&quot;chip pending&quot;&gt;최지훈&lt;/span&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;button class=&quot;btn btn-secondary&quot; type=&quot;button&quot;&gt;회신 리마인드 보내기&lt;/button&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- 상태 2: 마감 임박 · 미회신 있음 --&gt;
  &lt;div class=&quot;state-block&quot;&gt;
    &lt;p class=&quot;state-label&quot;&gt;상태 2 · 마감 임박 · 미회신 있음&lt;/p&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;span class=&quot;badge badge--closing&quot;&gt;확정 임박&lt;/span&gt;
      &lt;h1 class=&quot;meeting-title&quot;&gt;대학 동기&lt;/h1&gt;
      &lt;p class=&quot;meeting-sub&quot;&gt;참석 예정 6명&lt;/p&gt;
      &lt;div class=&quot;response-row&quot;&gt;
        &lt;div class=&quot;response-count&quot;&gt;5&lt;small&gt;/6명 회신&lt;/small&gt;&lt;/div&gt;
        &lt;div class=&quot;deadline&quot;&gt;&lt;div class=&quot;num urgent&quot;&gt;내일 마감&lt;/div&gt;&lt;div class=&quot;lbl&quot;&gt;D-1&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;hr class=&quot;sep&quot;&gt;
      &lt;div class=&quot;candidates&quot;&gt;
        &lt;div class=&quot;cand-row&quot;&gt;&lt;span class=&quot;cand-date&quot;&gt;10/17(토)&lt;/span&gt;&lt;div class=&quot;cand-bar-track&quot;&gt;&lt;div class=&quot;cand-bar best&quot; style=&quot;width:83%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;cand-n&quot;&gt;5/6&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;cand-row&quot;&gt;&lt;span class=&quot;cand-date&quot;&gt;10/18(일)&lt;/span&gt;&lt;div class=&quot;cand-bar-track&quot;&gt;&lt;div class=&quot;cand-bar&quot; style=&quot;width:33%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;cand-n&quot;&gt;2/6&lt;/span&gt;&lt;/div&gt;
        &lt;div class=&quot;cand-row&quot;&gt;&lt;span class=&quot;cand-date&quot;&gt;10/24(토)&lt;/span&gt;&lt;div class=&quot;cand-bar-track&quot;&gt;&lt;div class=&quot;cand-bar&quot; style=&quot;width:17%&quot;&gt;&lt;/div&gt;&lt;/div&gt;&lt;span class=&quot;cand-n&quot;&gt;1/6&lt;/span&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;hr class=&quot;sep&quot;&gt;
      &lt;div class=&quot;alert-box&quot;&gt;
        &lt;strong&gt;김민준님이 4일째 답이 없어요&lt;/strong&gt;
        &lt;span&gt;급한 건 아니지만, 마감이 얼마 남지 않았어요. 김민준님 없이 가장 많이 가능한 10/17(토)로 정해둘까요? 언제든 다시 물어볼 수 있어요.&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;btn-row&quot;&gt;
        &lt;button class=&quot;btn btn-secondary&quot; type=&quot;button&quot;&gt;조금 더 기다리기&lt;/button&gt;
        &lt;button class=&quot;btn btn-primary&quot; type=&quot;button&quot;&gt;10/17로 확정하기&lt;/button&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;!-- 상태 3: 확정 완료 --&gt;
  &lt;div class=&quot;state-block&quot;&gt;
    &lt;p class=&quot;state-label&quot;&gt;상태 3 · 확정 완료&lt;/p&gt;
    &lt;div class=&quot;card&quot;&gt;
      &lt;span class=&quot;badge badge--confirmed&quot;&gt;확정&lt;/span&gt;
      &lt;h1 class=&quot;meeting-title&quot;&gt;대학 동기&lt;/h1&gt;
      &lt;p class=&quot;meeting-sub&quot;&gt;참석 인원 6명&lt;/p&gt;
      &lt;hr class=&quot;sep&quot;&gt;
      &lt;p class=&quot;confirmed-date&quot;&gt;10월 17일 (토) 확정&lt;/p&gt;
      &lt;div class=&quot;pending-names&quot;&gt;

document.querySelectorAll(".tab").forEach(function(b){
  b.addEventListener("click",function(){
    document.querySelectorAll(".tab").forEach(function(x){x.setAttribute("aria-pressed",String(x===b));});
    document.querySelectorAll(".pane").forEach(function(p){p.hidden = p.dataset.i !== b.dataset.i;});
  });
});
</script>
