  * { box-sizing: border-box; }

&lt;style&gt;
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--color-semantic-bg-surface);
    font-family: var(--typography-family-body), var(--typography-family-fallback);
    color: var(--color-semantic-text-primary);
    max-width: var(--layout-content-max-width);
  }
  .screen { padding: var(--spacing-scale-5); display: flex; flex-direction: column; gap: var(--spacing-scale-8); }
  .state-block { display: flex; flex-direction: column; gap: var(--spacing-scale-4); }
  .state-label {
    font-size: var(--typography-scale-overline-size);
    letter-spacing: var(--typography-scale-overline-letterspacing);
    font-weight: var(--typography-scale-overline-weight);
    color: var(--color-semantic-text-secondary);
  }
  .card {
    background: var(--color-semantic-bg-elevated);
    border-radius: var(--radius-scale-xl);
    padding: var(--spacing-component-padding-card-y) var(--spacing-component-padding-card-x);
    box-shadow: var(--elevation-scale-sm-offset) var(--elevation-scale-sm-blur)px var(--elevation-scale-sm-spread)px rgba(23,27,24,0.07);
    display: flex; flex-direction: column; gap: var(--spacing-scale-4);
  }
  .meeting-title { font-size: var(--typography-scale-heading-1-size); font-weight: var(--typography-scale-heading-1-weight); line-height: var(--typography-scale-heading-1-lineheight); margin: 0; }
  .meeting-sub { font-size: var(--typography-scale-body-small-size); color: var(--color-semantic-text-secondary); margin: 0; }
  .badge {
    display: inline-flex; align-items: center; gap: var(--spacing-scale-1);
    padding: var(--spacing-scale-1) var(--spacing-scale-2);
    border-radius: var(--radius-scale-full);
    font-size: var(--typography-scale-caption-size); font-weight: var(--typography-scale-heading-3-weight);
    width: fit-content;
  }
  .badge--waiting { background: var(--color-semantic-status-waiting-bg); color: var(--color-semantic-status-waiting-text); }
  .badge--closing { background: var(--color-semantic-status-closing-bg); color: var(--color-semantic-status-closing-text); }
  .badge--confirmed { background: var(--color-semantic-status-confirmed-bg); color: var(--color-semantic-status-confirmed-text); }
  .response-row {
    display: flex; justify-content: space-between; align-items: baseline;
    padding-top: var(--spacing-scale-2); border-top: 1px solid var(--color-semantic-border-default);
  }
  .response-count { font-size: var(--typography-scale-display-size); font-weight: var(--typography-scale-display-weight); color: var(--color-semantic-brand-default); }
  .response-count small { font-size: var(--typography-scale-heading-3-size); color: var(--color-semantic-text-secondary); font-weight: var(--typography-scale-body-weight); }
  .deadline { text-align: right; }
  .deadline .num { font-size: var(--typography-scale-heading-2-size); font-weight: var(--typography-scale-heading-2-weight); }
  .deadline .num.urgent { color: var(--color-semantic-alert-deadline-text); }
  .deadline .lbl { font-size: var(--typography-scale-caption-size); color: var(--color-semantic-text-secondary); }
  .candidates { display: flex; flex-direction: column; gap: var(--spacing-scale-2); }
  .cand-row { display: flex; align-items: center; gap: var(--spacing-scale-3); }
  .cand-date { flex: 0 0 auto; font-size: var(--typography-scale-body-size); width: 84px; }
  .cand-bar-track { flex: 1; height: var(--spacing-scale-3); background: var(--color-semantic-bg-surface); border-radius: var(--radius-scale-full); overflow: hidden; }
  .cand-bar { height: 100%; background: var(--color-semantic-brand-default); border-radius: var(--radius-scale-full); }
  .cand-bar.best { background: var(--color-semantic-accent-default); }
  .cand-n { flex: 0 0 auto; font-size: var(--typography-scale-body-small-size); color: var(--color-semantic-text-secondary); width: 34px; text-align: right; }
  .chip {
    display: inline-flex; align-items: center; gap: var(--spacing-scale-1);
    padding: var(--spacing-scale-0-5) var(--spacing-scale-2);
    border-radius: var(--radius-scale-full);
    font-size: var(--typography-scale-caption-size);
  }
  .chip.ok { background: var(--color-semantic-response-yes-bg); color: var(--color-semantic-response-yes-text); }
  .chip.pending { border: 1px solid var(--color-semantic-border-default); color: var(--color-semantic-text-secondary); }
  .pending-list { display: flex; flex-direction: column; gap: var(--spacing-scale-2); }
  .pending-head { font-size: var(--typography-scale-body-small-size); color: var(--color-semantic-text-secondary); margin: 0; }
  .pending-names { display: flex; flex-wrap: wrap; gap: var(--spacing-scale-2); }
  .alert-box {
    background: var(--color-semantic-alert-deadline-bg); color: var(--color-semantic-alert-deadline-text);
    border-radius: var(--radius-scale-lg); padding: var(--spacing-scale-4);
    display: flex; flex-direction: column; gap: var(--spacing-scale-2);
    font-size: var(--typography-scale-body-small-size);
  }
  .alert-box strong { font-size: var(--typography-scale-body-size); }
  .btn {
    border: none; border-radius: var(--radius-scale-lg);
    padding: var(--spacing-component-padding-button-y) var(--spacing-component-padding-button-x);
    font-size: var(--typography-scale-body-size); font-weight: var(--typography-scale-heading-3-weight);
    cursor: pointer; width: 100%;
  }
  .btn-primary { background: var(--color-semantic-brand-default); color: var(--color-semantic-text-on-primary); }
  .btn-secondary { background: var(--color-semantic-bg-surface); color: var(--color-semantic-text-primary); border: 1px solid var(--color-semantic-border-default); }
  .btn-accent { background: var(--color-semantic-accent-default); color: var(--color-semantic-text-on-primary); }
  .btn-row { display: flex; gap: var(--spacing-scale-3); }
  .confirmed-date { font-size: var(--typography-scale-heading-2-size); font-weight: var(--typography-scale-heading-2-weight); color: var(--color-semantic-brand-hover); margin: 0; }
  hr.sep { border: none; border-top: 1px solid var(--color-semantic-border-default); margin: 0; }
&lt;/style&gt;

});
