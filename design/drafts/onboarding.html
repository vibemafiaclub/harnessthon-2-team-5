<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>온보딩(커플 연결) — 청첩장모임 스케줄러</title>
<link rel="stylesheet" href="tokens.css">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--color-semantic-bg-surface);
    font-family: var(--typography-family-fallback);
    color: var(--color-semantic-text-primary);
    display: flex;
    justify-content: center;
  }
  .screen {
    width: 100%;
    max-width: var(--layout-content-max-width);
    min-height: 100vh;
    background: var(--color-semantic-bg-page);
    padding: var(--spacing-scale-4);
  }
  header.app {
    display: flex;
    align-items: center;
    padding: var(--spacing-scale-4) 0 var(--spacing-scale-6);
    font-size: var(--typography-scale-heading-3-size);
    font-weight: var(--typography-scale-heading-3-weight);
  }
  .state-label {
    font-size: var(--typography-scale-overline-size);
    letter-spacing: var(--typography-scale-overline-letterspacing);
    color: var(--color-semantic-text-secondary);
    text-transform: uppercase;
    margin: var(--spacing-scale-8) 0 var(--spacing-scale-2);
    border-top: 1px dashed var(--color-semantic-border-default);
    padding-top: var(--spacing-scale-4);
  }
  .state-label:first-of-type { border-top: none; margin-top: 0; padding-top: 0; }

  h1.section-title, h2.section-title {
    font-size: var(--typography-scale-heading-1-size);
    font-weight: var(--typography-scale-heading-1-weight);
    margin: 0 0 var(--spacing-scale-2);
  }
  .lead {
    font-size: var(--typography-scale-body-size);
    color: var(--color-semantic-text-secondary);
    margin: 0 0 var(--spacing-scale-6);
  }

  /* STEP1: 신랑/신부 선택 */
  .role-select { display: flex; gap: var(--spacing-scale-3); margin-bottom: var(--spacing-scale-4); }
  .role-card {
    flex: 1;
    background: var(--color-semantic-bg-elevated);
    border: 1px solid var(--color-semantic-border-default);
    border-radius: var(--radius-scale-xl);
    padding: var(--spacing-scale-5) var(--spacing-scale-4);
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: var(--spacing-scale-1);
    font-family: inherit;
  }
  .role-card.selected { border: 2px solid var(--color-semantic-brand-default); background: var(--color-semantic-brand-subtle); }
  .role-label { font-size: var(--typography-scale-caption-size); color: var(--color-semantic-text-secondary); }
  .role-name { font-size: var(--typography-scale-heading-3-size); font-weight: 600; }

  .cta-button {
    display: block;
    width: 100%;
    text-align: center;
    background: var(--color-semantic-brand-default);
    color: var(--color-semantic-text-on-primary);
    font-size: var(--typography-scale-body-large-size);
    font-weight: 600;
    padding: var(--spacing-component-padding-button-y) var(--spacing-component-padding-button-x);
    border-radius: var(--radius-scale-lg);
    border: none;
  }

  /* STEP2: 초대 링크 */
  .invite-card {
    background: var(--color-semantic-bg-elevated);
    border-radius: var(--radius-scale-xl);
    box-shadow: var(--elevation-scale-sm-offset) var(--elevation-scale-sm-blur) var(--elevation-scale-sm-spread) rgba(23,27,24,var(--elevation-scale-sm-opacity));
    padding: var(--spacing-component-padding-card-y) var(--spacing-component-padding-card-x);
    margin-bottom: var(--spacing-scale-3);
  }
  .invite-link {
    background: var(--color-semantic-bg-surface);
    border: 1px dashed var(--color-semantic-border-default);
    border-radius: var(--radius-scale-md);
    padding: var(--spacing-scale-3) var(--spacing-scale-4);
    font-size: var(--typography-scale-body-small-size);
    color: var(--color-semantic-text-link);
    margin-bottom: var(--spacing-scale-3);
    word-break: break-all;
  }
  .invite-actions { display: flex; gap: var(--spacing-scale-2); }
  .btn-secondary {
    flex: 1;
    background: var(--color-semantic-bg-page);
    color: var(--color-semantic-brand-default);
    border: 1px solid var(--color-semantic-brand-default);
    border-radius: var(--radius-scale-lg);
    padding: var(--spacing-scale-2) var(--spacing-scale-3);
    font-size: var(--typography-scale-body-small-size);
    font-weight: 600;
  }
  .wait-row {
    display: flex;
    align-items: center;
    gap: var(--spacing-scale-2);
    padding: var(--spacing-scale-3) var(--spacing-scale-4);
  }
  .wait-text { font-size: var(--typography-scale-body-small-size); color: var(--color-semantic-text-secondary); }

  .badge {
    display: inline-block;
    font-size: var(--typography-scale-caption-size);
    font-weight: 600;
    padding: var(--spacing-scale-0-5) var(--spacing-scale-2);
    border-radius: var(--radius-scale-full);
    flex-shrink: 0;
  }
  .badge-waiting { background: var(--color-semantic-status-waiting-bg); color: var(--color-semantic-status-waiting-text); }
  .badge-confirmed { background: var(--color-semantic-status-confirmed-bg); color: var(--color-semantic-status-confirmed-text); }

  /* STEP3: 연결 완료 */
  .couple-confirmed {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: var(--spacing-scale-2);
    background: var(--color-semantic-bg-elevated);
    border-radius: var(--radius-scale-xl);
    padding: var(--spacing-component-padding-card-y) var(--spacing-component-padding-card-x);
    margin-bottom: var(--spacing-scale-4);
    box-shadow: var(--elevation-scale-sm-offset) var(--elevation-scale-sm-blur) var(--elevation-scale-sm-spread) rgba(23,27,24,var(--elevation-scale-sm-opacity));
  }
  .tag-groom, .tag-bride {
    padding: var(--spacing-scale-0-5) var(--spacing-scale-2);
    border-radius: var(--radius-scale-full);
    border: 1px solid var(--color-semantic-border-default);
    font-size: var(--typography-scale-body-small-size);
  }
  .tag-groom { color: var(--color-semantic-text-link); }
  .tag-bride { color: var(--color-semantic-accent-default); border-color: var(--color-semantic-accent-default); }
  .connector { color: var(--color-semantic-text-secondary); }
</style>
</head>
<body>
<div class="screen">

  <header class="app">모여줘</header>

  <div class="state-label">01 시작</div>
  <h1 class="section-title">청첩장 모임, 둘이 함께 정리해요</h1>
  <p class="lead">지인 리스트와 모임 일정을 신랑·신부가 같은 화면에서 확인해요.</p>
  <div class="role-select">
    <button class="role-card selected">
      <span class="role-label">신랑측</span>
      <span class="role-name">지훈</span>
    </button>
    <button class="role-card">
      <span class="role-label">신부측</span>
      <span class="role-name">서연</span>
    </button>
  </div>
  <button class="cta-button">시작하기</button>

  <!-- ASSUMPTION: 초대 링크 만료·재발급 정책은 PRD 미언급 — 화면에는 노출하지 않음 -->
  <div class="state-label">02 상대 초대</div>
  <h2 class="section-title">상대를 초대하세요</h2>
  <p class="lead">링크를 보내면 상대도 같은 지인·모임 목록을 보게 돼요.</p>
  <div class="invite-card">
    <div class="invite-link">moyeojwo.app/invite/9F2K7X</div>
    <div class="invite-actions">
      <button class="btn-secondary">링크 복사</button>
      <button class="btn-secondary">카카오톡으로 보내기</button>
    </div>
  </div>
  <div class="wait-row">
    <span class="badge badge-waiting">대기중</span>
    <span class="wait-text">서연님에게 초대를 보냈어요 · 아직 들어오지 않았어요</span>
  </div>

  <div class="state-label">03 연결 완료</div>
  <h2 class="section-title">연결됐어요</h2>
  <div class="couple-confirmed">
    <span class="tag-groom">신랑측 지훈</span>
    <span class="connector">+</span>
    <span class="tag-bride">신부측 서연</span>
    <span class="badge badge-confirmed">연결완료</span>
  </div>
  <p class="lead">이제 지인을 등록하면 모임을 만들 준비가 끝나요.</p>
  <button class="cta-button">지인 등록하러 가기</button>

</div>
</body>
</html>
