<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><title>대리인 확인</title><link rel="stylesheet" href="tokens.css">
<style>
.screen{width:390px;word-break:keep-all;overflow-wrap:break-word;color:var(--color-semantic-text-primary)}
header[data-fixed="top"] h1{font-size:calc(var(--typography-scale-display-size)*1px)}
.body{font-size:calc(var(--typography-scale-body-size)*1px)}
</style></head>
<body>
<section data-state="normal" class="screen" data-frame="390x844">
  <header data-fixed="top"><h1 data-role="top-info">지금 먹일 약 · 보리 관절약</h1></header>
  <button data-role="primary-action" data-above-fold="true">먹였어요</button>
</section>
<section data-state="empty" class="screen" data-frame="390x844"><p class="body">지금 먹일 약이 없어요. 다음 약은 저녁 6시예요.</p></section>
<section data-state="long" class="screen" data-frame="390x844"><p class="body">긴 목록</p></section>
</body></html>
